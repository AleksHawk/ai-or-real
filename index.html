<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ai or real | perle edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-effects"></div>

<div id="app-wrapper">
    <div id="ui-top">
        <div class="score-text">score: <span id="score-val">0</span>/10</div>
        <div class="round-text">round: <span id="round-val">1</span></div>
    </div>

    <div id="menu" class="overlay active">
        <div class="logo-container">
            <img src="logo.svg" alt="perle labs logo" class="main-logo">
        </div>
        
        <h1 class="title">ai or real?</h1>
        <p class="subtitle">perle labs digital challenge</p>
        
        <button id="btn-start" class="btn-primary">initiate test</button>

        <div class="perle-footer">
            made with love by <a href="https://x.com/hawk_tyt" target="_blank">hawk</a> for <a href="https://x.com/PerleLabs" target="_blank">perle community</a>
        </div>
    </div>

    <div id="gameplay" class="hidden">
        <div class="timer-container">
            <div id="timer-bar" class="timer-bar"></div>
        </div>

        <div class="card-container" id="main-card">
            <div id="loading-spinner">analyzing...</div>
            <img id="main-image" src="" alt="guess the image">
            <div class="noise"></div>
        </div>
        
        <div class="controls">
            <button id="btn-ai" class="btn-guess ai-btn">🤖 ai</button>
            <button id="btn-human" class="btn-guess human-btn">🧑 real</button>
        </div>
    </div>

    <div id="game-over" class="overlay hidden">
        <h1 class="title">test complete</h1>
        <p class="result-text">accuracy: <span id="final-score">0</span>/10</p>
        
        <div class="buttons">
            <button id="btn-restart" class="btn-primary">retry test</button>
            <button id="btn-x" class="btn-secondary">share result</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
