<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ai or real | perle edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

<div class="bg-effects"></div>

<div id="app-wrapper">
    <div id="ui-top" class="hidden">
        <div class="score-text">score: <span id="score-val">0</span>/10</div>
        <div class="round-text">round: <span id="round-val">1</span></div>
    </div>

    <div id="menu" class="overlay active">
        <div class="logo-container">
            <img src="logo.png" alt="perle labs logo" class="main-logo" onerror="this.style.display='none'">
        </div>
        
        <h1 class="title">ai or real?</h1>
        
        <p class="intro-credits">
            made with love by <a href="https://x.com/hawk_tyt" target="_blank">hawk</a><br>
            for <a href="https://x.com/PerleLabs" target="_blank">perle community</a>
        </p>
        
        <input type="text" id="nickname-input" class="input-field" placeholder="enter your nickname" autocomplete="off" maxlength="15">
        
        <button id="btn-start" class="btn-primary pulse-anim">initiate test</button>
    </div>

    <div id="gameplay" class="hidden">
        <div class="timer-container">
            <div id="timer-bar" class="timer-bar"></div>
        </div>

        <div class="card-container" id="main-card">
            <div id="loading-spinner">analyzing data...</div>
            <img id="main-image" src="" alt="guess the image">
            <div class="noise"></div>
        </div>
        
        <div class="controls">
            <button id="btn-ai" class="btn-guess ai-btn">🤖 ai</button>
            <button id="btn-human" class="btn-guess human-btn">🧑 real</button>
        </div>
    </div>

    <div id="game-over" class="overlay hidden">
        <h1 class="title" id="end-title">test complete</h1>
        <p class="subtitle" id="end-player-name">player</p>
        <p class="result-text">accuracy: <span id="final-score">0</span>/10</p>
        <p class="feedback-text" id="feedback-message"></p>
        
        <div class="buttons">
            <button id="btn-restart" class="btn-primary">retry test</button>
            <button id="btn-download" class="btn-secondary">download banner</button>
            <button id="btn-x" class="btn-secondary">share on x</button>
        </div>
    </div>
    
    <canvas id="share-canvas" width="1200" height="630" class="hidden"></canvas>
</div>

<script src="script.js"></script>
</body>
</html>
